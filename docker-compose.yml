services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reinfo
      POSTGRES_USER: reinfo
      POSTGRES_PASSWORD: reinfo
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reinfo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://reinfo:reinfo@db:5432/reinfo
      SECRET_KEY: dev-secret-key-change-in-prod
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: development
      PISTON_URL: http://piston:2000
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://reinfo:reinfo@db:5432/reinfo
      SECRET_KEY: dev-secret-key-change-in-prod
      ENVIRONMENT: development
      PISTON_URL: http://piston:2000
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    tmpfs:
      - /piston/jobs

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg_data:
