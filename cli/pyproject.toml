[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reinfo-cli"
version = "0.1.0"
description = "Command-line client and Python helper for ReInfo (reinfo.ro) - submit solutions, check status, scaffold problems, and work with AI/dataset problems from your terminal or notebook."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://reinfo.ro"
Repository = "https://github.com/dragosgatan/reinfo"

[project.scripts]
reinfo = "reinfo.main:cli"

[project.optional-dependencies]
dataset = [
    "pandas>=2.0",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "pandas>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["reinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["reinfo"]
