services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-reinfo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl isn't installed in the python:3.11-slim image, use urllib instead
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env.prod
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true
    environment:
      # piston's own defaults (run 3s / compile 10s) are too tight once per-language
      # multipliers and slow-compiling languages like zig are in play
      PISTON_RUN_TIMEOUT: "15000"
      PISTON_COMPILE_TIMEOUT: "30000"
    tmpfs:
      - /piston/jobs
    volumes:
      - piston_packages:/piston/packages
      # raises piston's hardcoded 100kb request body limit, see piston/index.js
      - ./piston/index.js:/piston_api/src/index.js:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  pg_data:
  piston_packages:
